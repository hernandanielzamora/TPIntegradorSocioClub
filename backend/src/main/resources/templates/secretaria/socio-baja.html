<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Confirmar baja de socio')}"></head>
<body>
<header th:replace="~{fragments/comunes :: encabezado('socios')}"></header>
<main id="contenido">
  <p class="etiqueta">Secretaría / Socios</p>
  <h1>Confirmar baja de socio</h1>
  <section class="confirmacion">
    <p class="confirmacion-socio" th:text="${socio.nombre}"></p>
    <p>La baja conserva los datos y el historial. No cambia el estado de cuota.</p>
    <p class="aviso advertencia" th:text="${'Se darán de baja ' + socio.inscripcionesActivas + ' inscripciones activas para liberar sus cupos.'}"></p>
    <p class="aviso" th:if="${socio.estadoSocio.name() == 'INACTIVO'}">El socio ya está inactivo. Confirmar nuevamente no lo reactiva.</p>
    <form class="acciones" method="post" th:action="@{/secretaria/socios/{id}/baja(id=${socio.id})}">
      <button class="peligro">Confirmar baja del socio y sus inscripciones activas</button>
      <a class="enlace-secundario" th:href="@{/secretaria/socios}">Cancelar</a>
    </form>
  </section>
</main>
<footer th:replace="~{fragments/comunes :: pie}"></footer>
</body>
</html>
