spring.application.name=SocioClub
server.port=${PORT:8080}

# La base debe existir; no se crean tablas ni datos en Prompt 01.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/socioclub}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Lista explícita de orígenes separados por comas, sin barra final.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500}
